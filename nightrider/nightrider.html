<!DOCTYPE html>
<!-- night rider — a two-lane freeway that plays synthwave. Brief by Gabriel, built by Claude. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>night rider</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#06030c;
    --mag:#ff2bd6;
    --cyan:#22e6ff;
    --red:#ff2a3a;
    --dim:#8f88a8;
    --text:#efe9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,monospace;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

  /* the title card: chrome and neon, gone after the first touch */
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1.4rem;cursor:pointer;transition:opacity .9s ease;
    background:radial-gradient(80% 60% at 50% 60%, rgba(60,10,70,.55), rgba(6,3,12,.75) 70%)}
  #start.gone{opacity:0;pointer-events:none}
  #start h1{font-family:Impact,'Arial Black','Helvetica Neue',Arial,sans-serif;font-style:italic;font-weight:900;
    font-size:clamp(46px,13vw,124px);letter-spacing:.04em;line-height:.92;text-align:center;padding:0 .2em}
  #start h1 .n{display:block;
    background:linear-gradient(180deg,#fff8dc 0%,#ffd45c 36%,#a4500a 50%,#ffcf4a 55%,#fff3c4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,190,70,.35))}
  #start h1 .r{display:block;color:transparent;-webkit-text-stroke:2px var(--mag);
    text-shadow:0 0 14px rgba(255,43,214,.75),0 0 44px rgba(255,43,214,.35)}
  #start p{font-size:11.5px;letter-spacing:.32em;color:var(--dim);animation:blink 2.4s ease-in-out infinite;text-align:center;line-height:2}
  @keyframes blink{50%{opacity:.35}}

  /* museum label: appears, breathes once, and gets out of the way */
  #label{position:fixed;left:max(20px, env(safe-area-inset-left));top:max(18px, env(safe-area-inset-top));
    pointer-events:none;opacity:0}
  #label.show{animation:label 13s ease forwards}
  #label h1{font-size:13px;font-weight:400;letter-spacing:.36em;color:var(--mag);text-shadow:0 0 9px rgba(255,43,214,.6)}
  #label p{font-size:11px;letter-spacing:.08em;color:var(--dim);margin-top:.55em;line-height:1.7}
  @keyframes label{0%{opacity:0}7%{opacity:1}74%{opacity:1}100%{opacity:0}}

  #pause{position:fixed;right:max(18px, env(safe-area-inset-right));top:max(14px, env(safe-area-inset-top));z-index:3;
    width:36px;height:30px;display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--mag);
    border:1px solid rgba(255,43,214,.3);background:rgba(10,4,16,.6);border-radius:6px;-webkit-tap-highlight-color:transparent;
    transition:border-color .15s,box-shadow .15s}
  #pause.show{display:flex}
  #pause svg{fill:currentColor;filter:drop-shadow(0 0 5px rgba(255,43,214,.7))}
  #pause .tri{display:none} #pause.paused .tri{display:block} #pause.paused .ii{display:none}
  @media (hover:hover){ #pause:hover{border-color:var(--mag);box-shadow:0 0 10px rgba(255,43,214,.4)} }
  #pause:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  #paused{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;
    background:rgba(6,3,12,.38);opacity:0;pointer-events:none;transition:opacity .25s}
  #paused.show{opacity:1}
  #paused h2{font-size:14px;font-weight:400;letter-spacing:.55em;color:var(--mag);text-shadow:0 0 12px rgba(255,43,214,.7);padding-left:.55em}
  #paused p{font-size:11px;letter-spacing:.3em;color:var(--dim)}
  #hud{position:fixed;right:max(20px, env(safe-area-inset-right));top:calc(max(14px, env(safe-area-inset-top)) + 38px);
    font-size:11px;letter-spacing:.26em;color:var(--dim);text-align:right;pointer-events:none;line-height:1.9}
  #hud b{font-weight:400;color:var(--cyan);text-shadow:0 0 8px rgba(34,230,255,.6);display:inline-block}
  #hud b.pop{animation:pop .32s ease}
  @keyframes pop{35%{transform:scale(1.4)}}
  #hud .crash{color:var(--red);text-shadow:0 0 8px rgba(255,42,58,.7)}

  /* the dashboard: KITT's console, repurposed as a mixer */
  #dash{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;gap:8px;
    padding:14px 12px max(12px, env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(6,3,12,0), rgba(6,3,12,.88) 45%)}
  .tg{border:1px solid rgba(255,43,214,.26);background:rgba(10,4,16,.72);color:rgba(255,43,214,.5);
    font:inherit;font-size:10px;letter-spacing:.22em;padding:9px 0;width:66px;border-radius:6px;cursor:pointer;
    transition:color .15s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
  .tg.on{color:#ffd9f6;border-color:var(--mag);box-shadow:0 0 12px rgba(255,43,214,.45),inset 0 0 10px rgba(255,43,214,.22);
    text-shadow:0 0 8px rgba(255,43,214,.9)}
  @media (hover:hover){ .tg:hover{border-color:rgba(255,43,214,.7);color:#ffd9f6} }
  #vb{display:flex;flex-direction:column;align-items:center;gap:3px;margin:0 6px}
  #vbc{width:84px;height:44px;display:block}
  #prog{border:0;background:none;color:var(--cyan);font:inherit;font-size:9.5px;letter-spacing:.28em;cursor:pointer;
    padding:3px 8px;text-shadow:0 0 8px rgba(34,230,255,.6);-webkit-tap-highlight-color:transparent}
  #prog:focus-visible,.tg:focus-visible,#vols:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
  #vol{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;padding:8px 8px 7px;border-radius:6px;
    border:1px solid rgba(255,43,214,.26);background:rgba(10,4,16,.72)}
  #vol span{font-size:10px;letter-spacing:.22em;color:rgba(255,43,214,.5);pointer-events:none}
  #vols{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;background:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  #vols::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--mag) var(--p,100%),rgba(255,43,214,.18) var(--p,100%))}
  #vols::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;margin-top:-3.5px;
    background:#ffd9f6;border:1px solid var(--mag);box-shadow:0 0 8px rgba(255,43,214,.8)}
  #vols::-moz-range-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--mag) var(--p,100%),rgba(255,43,214,.18) var(--p,100%))}
  #vols::-moz-range-thumb{width:8px;height:8px;border-radius:50%;background:#ffd9f6;border:1px solid var(--mag);
    box-shadow:0 0 8px rgba(255,43,214,.8)}
  @media (hover:hover){ #vol:hover{border-color:rgba(255,43,214,.7)} #vol:hover span{color:#ffd9f6} }
  @media (max-width:420px){ .tg{width:56px;font-size:9px;letter-spacing:.14em;padding:8px 0} #vbc{width:72px} #vb{margin:0 2px}
    #vol{width:56px;padding:7px 6px 6px} #vol span{font-size:9px;letter-spacing:.14em} }

  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    padding:2rem;color:var(--dim);font-size:13px;letter-spacing:.08em;line-height:1.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><h1><span class="n">NIGHT</span><span class="r">RIDER</span></h1><p id="startp">press any key &middot; tap to start</p></div>
<div id="label"><h1>night rider</h1><p id="labelp"></p></div>
<button id="pause" aria-label="pause"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><g class="ii"><rect x="2" y="1.5" width="3" height="9"/><rect x="7" y="1.5" width="3" height="9"/></g><path class="tri" d="M2.5 1.5 L10.5 6 L2.5 10.5 Z"/></svg></button>
<div id="paused"><h2>PAUSED</h2><p id="pausedp"></p></div>
<div id="hud">streak <b id="streak">0</b><br>best <b id="best">0</b></div>
<div id="dash">
  <button class="tg on" data-layer="drums">DRUMS</button>
  <button class="tg on" data-layer="bass">BASS</button>
  <div id="vb"><canvas id="vbc"></canvas><button id="prog" aria-label="cycle chord progression">ANTHEM</button></div>
  <button class="tg on" data-layer="arp">ARP</button>
  <button class="tg on" data-layer="pad">PAD</button>
  <div id="vol"><input id="vols" type="range" min="0" max="100" step="1" value="100" aria-label="volume"><span>VOL</span></div>
</div>
<div id="nogl">night rider needs WebGL for its freeway.</div>

<script type="module">
import * as THREE from './three.module.min.js';

/* ============================================================================
   night rider — a two-lane freeway that plays synthwave.

   Everything runs on one clock: the audio clock. The road's dashes pass at
   one per beat, the shoulder reflectors at one per two beats, and every car
   in the slow lane is scheduled to reach you exactly on a sixteenth-note.
   Across the median, oncoming headlights arrive on the same grid. Each car
   carries a note of the bar's chord (its colour is its pitch class). Pass it
   and the note plays; the later you swerve, the brighter and louder it is.
   Hit it and the mix collapses for a bar. Tap the road to play a lead over
   the top. The dashboard is KITT's console, repurposed as a mixer.

   Rendering: Three.js into a render target, then a two-level bloom and a
   composite pass (chromatic aberration, scanlines, glitch on impact).
   Audio: Web Audio only, synthesised live; no samples.
============================================================================ */

/* ---------------------------------------------------------------- tuning */

const BPM   = 112;
const BEAT  = 60 / BPM, STEP = BEAT / 4, BAR = BEAT * 4;
const DASH  = 16;                       // m of road per dash cycle = one beat
const SPEED = DASH / BEAT;              // ≈ 29.9 m/s, fixed; the road is the metronome
const TRAFFIC_V = 12;                   // m/s, the slow lane
const REL   = SPEED - TRAFFIC_V;        // closing speed, m/s
const VIS   = 270;                      // m, where traffic emerges from the fog
const LANE_X = [1.8, -1.8];             // lane 1 (right, traffic), lane 2 (left, always empty)
const ROAD_R = 3.6, ROAD_L = -12.8;     // our carriageway [-3.6, 3.6], median [-5.6, -3.6], theirs [-12.8, -5.6]
const ONC_X = -11.0;                    // the oncoming outer lane; their inner lane (-7.4) is always empty
const ONC_V = SPEED + TRAFFIC_V;        // closing speed of oncoming traffic
const MAXONC = 16;
const SWERVE = 0.32;                    // s, a lane change
const HIT_DX = 1.5, HIT_DZ = 4.2;       // collision box (cars are 1.9 × 4.4)
const KEY   = 45;                       // A2. Bass an octave down, pads/arp up, lead two up.
const I0    = 0.45;                     // starting intensity (0 = muffled, 1 = wide open)
const MAXCARS = 24;

/* ----------------------------------------------------------- tiny utils */

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const mtof  = m => 440 * Math.pow(2, (m - 69) / 12);
const easeOut = t => 1 - Math.pow(1 - t, 3);
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const qs = new URLSearchParams(location.search);
const seed = qs.has('seed') ? (parseInt(qs.get('seed'), 10) | 0) : (Date.now() & 0x7fffffff);
const rng = mulberry32(seed);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const coarse = matchMedia('(pointer: coarse)').matches;

/* ---------------------------------------------------------- music theory */

// Chords as (root semitone relative to A, four voicing tones). The key is A
// minor throughout; the roots are chosen so every bass note sits in one octave.
const CH = (name, root, tones) => ({ name, root, tones });
const M7=[0,3,7,10], MA7=[0,4,7,11], D7=[0,4,7,10], SIX=[0,4,7,9];
const PROGS = [
  { name:'ANTHEM', chords:[CH('Am',0,M7), CH('F',-4,MA7), CH('C',3,MA7),  CH('G',-2,SIX)] },
  { name:'DRIVE',  chords:[CH('Am',0,M7), CH('G',-2,SIX), CH('F',-4,MA7), CH('G',-2,D7)] },
  { name:'NOIR',   chords:[CH('Am',0,M7), CH('Dm',5,M7),  CH('F',-4,MA7), CH('E7',7,D7)] },
  { name:'RISE',   chords:[CH('F',-4,MA7), CH('G',-2,SIX), CH('Am',0,M7), CH('C',3,MA7)] },
];
const PENTA2 = [0,3,5,7,10,12,15,17];           // A minor pentatonic, 8 columns of road
// Pitch class → neon hue. Cyan A, magenta C, violet D, amber E, pink G.
const HUES = {9:190, 0:305, 2:265, 4:45, 7:330, 11:160, 5:215, 8:20, 1:280, 3:120, 6:240, 10:350};
const hueOf = midi => HUES[((midi % 12) + 12) % 12];

const ARPS = [
  [0,1,2,3,4,5,6,7,0,1,2,3,4,5,6,7],
  [0,1,2,3,4,5,6,7,7,6,5,4,3,2,1,0],
  [0,4,2,6,1,5,3,7,0,4,2,6,1,5,3,7],
  [0,2,4,6,7,6,4,2,0,2,4,6,7,5,3,1],
  [0,0,4,0,2,0,4,0,0,0,4,0,2,4,6,4],
];
const BASSP = [
  [0,0,12,0, 0,0,12,0, 0,0,12,0, 0,12,0,12],                         // the octave gallop
  [0,null,0,null, 0,null,0,null, 0,null,0,null, 0,null,7,null],       // eighths, a fifth to turn
];
// Traffic phrases: four bars of sixteenth-step offsets. A car per offset.
const PH = {
  intro: [ [[0],[],[0],[]], [[0],[],[8],[]], [[0],[8],[0],[]], [[8],[],[0],[8]] ],
  mid:   [ [[0],[0,8],[0],[0,8]], [[0,8],[0,8],[4,12],[0]], [[0],[6],[0,8],[]], [[0,8],[],[0,8],[8]], [[0,4],[8],[0,4],[8,12]], [[0],[0,6],[0],[0,10]] ],
  hot:   [ [[0,4,8],[],[0,2,4,6],[]], [[0,8],[0,8],[0,4,8,12],[]], [[0,2,4,6],[8],[0,2,4,6],[8,12]], [[0,6],[0,6],[0,6],[0,4,8,12]], [[0,4,8,12],[0],[0,4,8,12],[8]] ],
};
const MOTIFS = [[0,2,4,2],[0,1,2,3,4,5],[4,2,0,2],[0,4,3,1],[2,4,5,4,2,0],[0,0,4,5],[5,4,2,4]];

/* ----------------------------------------------------------- the synth */

// Pure Web Audio. makeEngine() takes any BaseAudioContext so the same code
// renders offline for tests. Buses: drums → bus; music (bass, arp, pad) →
// sidechain duck → bus; lead → bus. bus → master lowpass (the "intensity"
// filter) → compressor → out. Sends: ping-pong delay, plate-ish reverb, and
// a gated reverb for the snare, because 1984.
function makeEngine(ctx){
  const master = ctx.createGain(); master.gain.value = 0.82;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.16;
  const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.Q.value = 0.6; lpf.frequency.value = 2200;
  const bus = ctx.createGain();
  bus.connect(lpf); lpf.connect(comp); comp.connect(master); master.connect(ctx.destination);
  const analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.55; master.connect(analyser);

  const drums = ctx.createGain(); drums.gain.value = 1.0; drums.connect(bus);
  const duck  = ctx.createGain(); duck.connect(bus);
  const music = ctx.createGain(); music.gain.value = 0.9; music.connect(duck);
  const lead  = ctx.createGain(); lead.gain.value = 0.85; lead.connect(bus);

  // ping-pong delay, dotted eighth
  const dl = ctx.createDelay(1), dr = ctx.createDelay(1); dl.delayTime.value = dr.delayTime.value = STEP * 3;
  const fb = ctx.createGain(); fb.gain.value = 0.42;
  const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 3400;
  const dlySend = ctx.createGain();
  dlySend.connect(dl); dl.connect(dr); dr.connect(dlp); dlp.connect(fb); fb.connect(dl);
  const merger = ctx.createChannelMerger(2); dl.connect(merger, 0, 0); dr.connect(merger, 0, 1);
  const dlyOut = ctx.createGain(); dlyOut.gain.value = 0.45; merger.connect(dlyOut); dlyOut.connect(bus);

  function makeIR(dur, decay, gate){
    const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++){ const d = b.getChannelData(c);
      for (let i = 0; i < n; i++){ const t = i / ctx.sampleRate; let e = Math.exp(-t * decay);
        if (gate) e *= t < dur - 0.02 ? 1 : (dur - t) / 0.02;
        d[i] = (Math.random() * 2 - 1) * e; } }
    return b;
  }
  const verb = ctx.createConvolver(); verb.buffer = makeIR(2.4, 3.0, false);
  const verbSend = ctx.createGain(); verbSend.connect(verb);
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.5; verb.connect(verbOut); verbOut.connect(bus);
  const gate = ctx.createConvolver(); gate.buffer = makeIR(0.30, 5.0, true);
  const gateSend = ctx.createGain(); gateSend.gain.value = 0.7; gateSend.connect(gate); gate.connect(drums);

  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const distCurve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++){ const x = i / 511.5 - 1; distCurve[i] = Math.tanh(x * 9) / Math.tanh(9); }

  const osc = (type, f, t0, t1, det = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det; o.start(t0); o.stop(t1); return o; };
  const noise = (t0, t1) => { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t0); s.stop(t1); return s; };
  const send = (node, to, g) => { const s = ctx.createGain(); s.gain.value = g; node.connect(s); s.connect(to); };
  const pan = (to, p) => { if (!ctx.createStereoPanner) return to; const n = ctx.createStereoPanner(); n.pan.value = p; n.connect(to); return n; };
  const E = 0.0005;

  function duckAt(t){
    duck.gain.cancelScheduledValues(t); duck.gain.setValueAtTime(0.4, t); duck.gain.linearRampToValueAtTime(1, t + BEAT * 0.6);
  }
  function kick(t, v = 1){
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(175, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.07);
    const g = ctx.createGain(); g.gain.setValueAtTime(1.05 * v, t); g.gain.exponentialRampToValueAtTime(E, t + 0.40);
    o.connect(g); g.connect(drums); o.start(t); o.stop(t + 0.42);
    const n = noise(t, t + 0.03); const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(0.3 * v, t); ng.gain.exponentialRampToValueAtTime(E, t + 0.025);
    n.connect(hp); hp.connect(ng); ng.connect(drums);
    duckAt(t);
  }
  function snare(t, v = 1){
    const n = noise(t, t + 0.3); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.9 * v, t); g.gain.exponentialRampToValueAtTime(E, t + 0.22);
    n.connect(bp); bp.connect(g); g.connect(drums); g.connect(gateSend);
    const o = osc('triangle', 190, t, t + 0.15); o.frequency.exponentialRampToValueAtTime(120, t + 0.1);
    const og = ctx.createGain(); og.gain.setValueAtTime(0.55 * v, t); og.gain.exponentialRampToValueAtTime(E, t + 0.12);
    o.connect(og); og.connect(drums);
  }
  function hat(t, v = 1, open = false){
    const d = open ? 0.30 : 0.05; const n = noise(t, t + d + 0.02);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.3 * v, t); g.gain.exponentialRampToValueAtTime(E, t + d);
    n.connect(hp); hp.connect(g); g.connect(drums);
  }
  function cym(t, v = 1){
    const n = noise(t, t + 1.6); const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.35 * v, t); g.gain.exponentialRampToValueAtTime(E, t + 1.5);
    n.connect(hp); hp.connect(g); g.connect(drums); send(g, verbSend, 0.5);
  }
  function bass(t, midi, dur, v = 1){
    const f = mtof(midi), end = t + dur;
    const o1 = osc('sawtooth', f, t, end + 0.05, -6), o2 = osc('sawtooth', f, t, end + 0.05, 6);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 5;
    lp.frequency.setValueAtTime(320 + 1500 * v, t); lp.frequency.exponentialRampToValueAtTime(240, t + 0.16);
    const g = ctx.createGain(); g.gain.setValueAtTime(E, t); g.gain.linearRampToValueAtTime(0.16 * v, t + 0.006);

    sg.gain.setValueAtTime(0.11 * v, t); sg.gain.setValueAtTime(0.11 * v, end - 0.03); sg.gain.exponentialRampToValueAtTime(E, end + 0.02);
    s.connect(sg); sg.connect(music);

    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(900 + 5000 * bright, t); lp.frequency.exponentialRampToValueAtTime(420, t + 0.22);
    const g = ctx.createGain(); g.gain.setValueAtTime(E, t); g.gain.linearRampToValueAtTime(0.16 * v, t + 0.004); g.gain.exponentialRampToValueAtTime(E, t + 0.26);

    const g = ctx.createGain(); g.gain.setValueAtTime(E, t); g.gain.linearRampToValueAtTime(1, t + 0.5);
    g.gain.setValueAtTime(1, t + dur - 0.05); g.gain.linearRampToValueAtTime(E, end);

    const g = ctx.createGain(); g.gain.setValueAtTime(E, t); g.gain.linearRampToValueAtTime(0.14, t + 0.008); g.gain.exponentialRampToValueAtTime(E, t + dur);

  function setVolume(v){ level = 0.82 * v * v; applyLevel(); }

  return { ctx, kick, snare, hat, cym, bass, arp, pad, leadNote, tapNote, crash, whoosh, doppler, riser, setCutoff, setMuted, setVolume, analyser, master, lpf };
}

// The arrangement. One chord per bar, four bars per progression. Every 32
// bars the kick drops out for a four-bar build with snare rolls and a riser,
// then lands. Fills close every fourth bar. Intensity (0..1) opens the
// hats and the arp; the master filter is driven from outside.
function makeSequencer(eng, api){
  let arpPat = ARPS[0], arpBar = -1;
  const events = [];   // visual cues, in song-time
  function scheduleStep(step, t){
    const bar = step >> 4, s = step & 15, beat = s >> 2, sub = s & 3;
    const ch = api.chordAt(bar), I = api.intensity(), L = api.layers;
    const b32 = bar % 32, build = bar >= 28 && b32 >= 28, drop = bar > 0 && b32 === 0;
    if (bar >> 3 !== arpBar){ arpBar = bar >> 3; arpPat = ARPS[Math.floor(api.rng() * ARPS.length)]; }
    const drumsOn = L.drums && step >= api.drumMutedUntil();
    if (s === 0){
      if (L.pad) eng.pad(t, ch.tones.map(x => KEY + 12 + ch.root + x), BAR);
      if (drop){ if (drumsOn) eng.cym(t); events.push({ t: t - api.tOff(), kind: 'drop' }); }
      else if (bar % 8 === 0 && drumsOn) eng.cym(t, 0.6);
      if (build && b32 === 28 && drumsOn) eng.riser(t, BAR * 4);
      events.push({ t: t - api.tOff(), kind: 'bar' });
    }
    if (drumsOn){
      if (!build){
        if (sub === 0) eng.kick(t, beat === 0 ? 1 : 0.92);
        if (I > 0.7 && s === 10 && (bar & 1)) eng.kick(t, 0.7);
        if (s === 4 || s === 12) eng.snare(t, 1);
        if (bar % 4 === 3 && s > 12) eng.snare(t, 0.35 + 0.2 * (s - 12));
      } else {
        const k = b32 - 28;
        if (k < 2){ if ((s & 1) === 0) eng.snare(t, 0.5 + 0.2 * k + 0.1 * (s / 16)); }
        else eng.snare(t, 0.7 + 0.3 * ((k - 2) * 16 + s) / 32);
      }
      if (sub === 0) eng.hat(t, 0.9); else if (sub === 2) eng.hat(t, 0.55); else if (I > 0.55) eng.hat(t, 0.28 + 0.1 * (s % 3));
      if (s === 14 && (bar & 1) && I > 0.35) eng.hat(t, 0.7, true);
    }
    if (L.bass && !(build && b32 >= 30)){
      const p = BASSP[(bar >> 3) & 1][s];
      if (p !== null) eng.bass(t, KEY - 12 + ch.root + p, STEP * 0.85, sub === 0 ? 1 : 0.8);
    }
    if (L.arp){
      const tones = [ch.tones[0], ch.tones[1], ch.tones[2], ch.tones[3], ch.tones[0] + 12, ch.tones[1] + 12, ch.tones[2] + 12, ch.tones[3] + 12];
      eng.arp(t, KEY + 12 + ch.root + tones[arpPat[s]], sub === 0 ? 1 : 0.8, 0.25 + 0.75 * I);
    }
  }
  return { scheduleStep, events };
}

const cars = [], oncoming = [];

// Traffic weather. Density breathes with the 32-bar cycle — a surge lands on
// the drop, a breather opens mid-cycle, the lane clears under the build — and
// each cycle draws its own temperature, so whole cycles run calm or hot.
let heat = 1, heatCyc = -1;
function demandAt(bar){
  const cyc = Math.floor(bar / 32);
  if (cyc !== heatCyc){ heatCyc = cyc; heat = 0.4 + rng() * 0.6; }
  const b = bar % 32;
  return heat * (b < 8 ? 1 : b < 16 ? 0.6 : b < 24 ? 0.25 : b < 28 ? 0.6 : 0.1);
}
const ONC_P = [[], [0], [8], [0, 8], [4], [12], [2, 10], [0, 6], [0, 8, 12]];   // roughly sparse → dense
function genOncomingBar(bar){
  if (bar - bar0 < 3) return;                                  // 270 m at closing speed is about three bars
  for (const s of ONC_P[Math.floor(rng() * (3 + Math.round(demandAt(bar) * 6)))]){ const step = bar * 16 + s;
    oncoming.push({ step, arrT: step * STEP, passed: false, done: false, z: -1e9 }); }
}
function setCarNote(c){
  const ch = chordAt(c.bar);
  const tones = [ch.tones[0], ch.tones[1], ch.tones[2], ch.tones[3], ch.tones[0] + 12, ch.tones[1] + 12];
  c.midi = KEY + 24 + ch.root + tones[c.ti]; c.hue = hueOf(c.midi);
  c.col.setHSL(c.hue / 360, 1, 0.6, THREE.SRGBColorSpace);
}
function genTrafficBar(bar){
  genOncomingBar(bar);
  const rel = bar - bar0; if (rel < 6) return;               // the first car needs 15 s to arrive from the fog
  if ((bar & 3) === 0){
    // phrases sit on the chord cycle, so a hot phrase's wall arrives with the drop
    const d = Math.min(1, (rel - 6) / 24) * demandAt(bar) + (rng() - 0.5) * 0.12;
    const pool = d < 0.34 ? PH.intro : d < 0.62 ? PH.mid : PH.hot;
    phrase = pool[Math.floor(rng() * pool.length)];
    if ((bar & 4) === 0){ motif = MOTIFS[Math.floor(rng() * MOTIFS.length)]; motifK = 0; }
  }
  for (const s of phrase[bar & 3]){
    const ti = motif[motifK++ % motif.length], step = bar * 16 + s;
    const c = { bar, ti, step, arrT: step * STEP, midi: 0, hue: 0, col: new THREE.Color(), dare: undefined,
      passed: false, crashed: false, crashT: 0, flash: -9, done: false, z: -1e9 };
    setCarNote(c); cars.push(c);
  }
}
function ensureTraffic(uptoBar){ while (genBar < uptoBar) { genBar++; genTrafficBar(genBar); } }

const backMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, fog: false,

    cHalo: { value: PAL.halo }, cMtnFar: { value: PAL.mtnFar }, cMtnNear: { value: PAL.mtnNear }, cCity: { value: PAL.city },

  vertexShader: `varying vec2 vN; void main(){ vN = position.xy; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,

    void main(){

      float sx = uVpx * uAspect, dx = p.x - sx;

      col = mix(col, cMtnNear, smoothstep(m2 + aa, m2 - aa, p.y) * above);

let resScale = 1, fpsEMA = 60, frames = 0;
function sizeTargets(){
  const w = Math.max(2, Math.floor(renderer.domElement.width * resScale)), h = Math.max(2, Math.floor(renderer.domElement.height * resScale));

    rtScene.setSize(w, h); rtA.setSize(w >> 2, h >> 2); rtB.setSize(w >> 2, h >> 2); rtC.setSize(w >> 3, h >> 3); rtD.setSize(w >> 3, h >> 3);

}
function frameCamera(){

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); frameCamera(); sizeTargets(); });
frameCamera(); sizeTargets();

/* -------------------------------------------------------------- DOM */

const $ = id => document.getElementById(id);
const startEl = $('start'), labelEl = $('label'), streakEl = $('streak'), bestEl = $('best'), progBtn = $('prog'), vbc = $('vbc');
$('labelp').innerHTML = coarse ? 'swipe to change lanes &middot; tap the road to play<br>pass close for a brighter note' : '&larr; &rarr; change lanes &middot; click the road to play<br>pass close for a brighter note &middot; space pauses';
$('pausedp').innerHTML = coarse ? 'tap to resume' : 'space &middot; click to resume';
const pauseBtn = $('pause'), pausedEl = $('paused');
function setPaused(p){

pauseBtn.addEventListener('click', () => { setPaused(!S.paused); pauseBtn.blur(); });
$('startp').innerHTML = coarse ? 'tap to start' : 'press any key &middot; click to start';
bestEl.textContent = S.best;
function setStreak(n, crashed){

  streakEl.classList.add(crashed ? 'crash' : 'pop');

}
for (const b of document.querySelectorAll('.tg')) b.addEventListener('click', () => {

function setProg(i){ S.prog = i; progBtn.textContent = PROGS[i].name; for (const c of cars) if (!c.passed && !c.crashed) setCarNote(c); }
const volEl = $('vols');
function setVolume(v){
  S.vol = clamp(v, 0, 1); volEl.style.setProperty('--p', Math.round(S.vol * 100) + '%');
  if (+volEl.value !== Math.round(S.vol * 100)) volEl.value = Math.round(S.vol * 100);
  if (S.muted){ S.muted = false; if (eng) eng.setMuted(false); }   // touching the knob unmutes
  if (eng) eng.setVolume(S.vol);
  try { localStorage.setItem('nightrider.vol', String(S.vol)); } catch(e){}
}
volEl.value = Math.round(S.vol * 100); volEl.style.setProperty('--p', Math.round(S.vol * 100) + '%');
volEl.addEventListener('input', () => setVolume(volEl.value / 100));
volEl.addEventListener('pointerup', () => volEl.blur());

const vctx = vbc.getContext('2d'); const vbLevels = [0, 0, 0]; const fftBuf = new Uint8Array(128);

  vctx.setTransform(dpr, 0, 0, dpr, 0, 0); vctx.clearRect(0, 0, W, H);

    const band = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += fftBuf[i]; return Math.pow(s / (b - a) / 255, 1.4); };

    for (let i = 0; i < 3; i++) vbLevels[i] = tgt[i] > vbLevels[i] ? lerp(vbLevels[i], tgt[i], 0.6) : lerp(vbLevels[i], tgt[i], 0.18);

}

/* --------------------------------------------------------------- audio start */

function start(){
  if (S.started) return;

  const Tpre = (performance.now() - perf0) / 1000;
  tOff = Tpre - ctx.currentTime; S.started = true;
  seq = makeSequencer(eng, { chordAt, intensity: () => S.I, layers: S.layers, rng, drumMutedUntil: () => drumMutedUntil, tOff: () => tOff });
  nextStep = Math.ceil(Tpre / STEP) + 2;
  bar0 = Math.floor(Tpre / BAR) + 1; ensureTraffic(bar0 + 8);
  const tick = () => {
    const now = ctx.currentTime + tOff;
    if (nextStep * STEP < now - 0.5) nextStep = Math.ceil(now / STEP) + 1;      // tab was asleep: don't replay the past
    while (nextStep * STEP < now + 0.12){ seq.scheduleStep(nextStep, nextStep * STEP - tOff); ensureTraffic((nextStep >> 4) + 8); nextStep++; }
    eng.setCutoff(300 * Math.pow(2, 5.9 * S.I));
  };
  seqTimer = setInterval(tick, 25); tick();
  if (ctx.state !== 'running') ctx.resume();
  startEl.classList.add('gone'); labelEl.classList.add('show'); pauseBtn.classList.add('show');
  document.addEventListener('visibilitychange', () => { if (document.hidden) ctx.suspend(); else if (!S.paused) ctx.resume(); });
}

/* ------------------------------------------------------------------ play */

let T = 0;
function steer(dir){          // -1 left, +1 right
  const want = dir < 0 ? 1 : 0; if (want === S.lane) return;
  S.lane = want; S.tw = { from: S.px, to: LANE_X[want], t0: T };
  if (want === 1){ let best = null;   // the dare: how close was the nearest car when you finally moved
    for (const c of cars){ if (c.done || c.passed || c.crashed) continue; if (c.z > -70 && c.z < 4 && (!best || c.z > best.z)) best = c; }
    if (best) best.dare = -best.z; }

}
function tapAt(cx, cy){
  const col = clamp(Math.floor(cx / innerWidth * 8), 0, 7), yN = 1 - cy / innerHeight;

}
function doPass(c){

  c.passed = true; c.flash = T; c.vel = vel; S.passes++;

/* ---------------------------------------------------------------- input */

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.target === volEl) return;                                          // a focused volume slider owns its keys
  if (e.key === ' ' && e.target && e.target.tagName === 'BUTTON') return;   // a focused dashboard button owns Space
  if (e.key === ' ' || e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ if (S.started) setPaused(!S.paused); else start(); e.preventDefault(); return; }
  if (!S.started){ start(); }
  if (S.paused) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ steer(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ steer(1); e.preventDefault(); }
  else if (e.key >= '1' && e.key <= '8'){ const i = e.key.charCodeAt(0) - 49; tapAt((i + 0.5) / 8 * innerWidth, innerHeight * 0.42); }
  else if (e.key === 'm' || e.key === 'M'){ S.muted = !S.muted; if (eng) eng.setMuted(S.muted); }
});
const ptr = { id: null, x0: 0, y0: 0, t0: 0, swiped: false };
canvas.addEventListener('pointerdown', e => { ptr.id = e.pointerId; ptr.x0 = e.clientX; ptr.y0 = e.clientY; ptr.t0 = performance.now(); ptr.swiped = false; });
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== ptr.id || ptr.swiped || S.paused) return;
  const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy) * 1.2){ ptr.swiped = true; if (!S.started) start(); steer(Math.sign(dx)); }
});
canvas.addEventListener('pointerup', e => {
  if (e.pointerId !== ptr.id) return; ptr.id = null;
  const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0, dt = performance.now() - ptr.t0;

canvas.addEventListener('pointercancel', () => { ptr.id = null; });
startEl.addEventListener('pointerup', () => start());
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------------------------------------------------------------- frame */

const dummy = new THREE.Object3D(), tmpC = new THREE.Color(), tmpV = new THREE.Vector3();
let lastT = performance.now(), frameNo = 0;
function frame(now){

    if (fpsEMA < 30 && resScale > 0.5){ resScale = Math.max(0.5, resScale * 0.88); sizeTargets(); }

  }

  S.roll = lerp(S.roll, clamp(-pxv * 0.045, -0.22, 0.22), 1 - Math.exp(-dt * 18));
  player.position.x = S.px; player.rotation.z = S.roll;

  // traffic: positions come straight off the clock
  let n = 0;
  for (const c of cars){
    if (c.done) continue;
    const z = (T - c.arrT) * REL; c.z = z;
    if (z < -VIS) break;
    if (z > 14){ c.done = true; continue; }
    if (!c.crashed && z > -HIT_DZ && z < HIT_DZ && Math.abs(S.px - LANE_X[0]) < HIT_DX) doCrash(c);
    if (!c.crashed && !c.passed && z >= 0) doPass(c);

    tmpC.copy(PAL.halo2).multiplyScalar(fade); carHalo.setColorAt(n, tmpC); carSmear.setColorAt(n, tmpC);
    tmpC.copy(PAL.beam).multiplyScalar(fade); carBeam.setColorAt(n, tmpC);

    if (m >= MAXONC) break;

    for (const mesh of oncMeshes) mesh.setMatrixAt(m, dummy.matrix);

    for (const sx of [-13.6, 4.4]){ dummy.position.set(sx, 0, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
      posts.setMatrixAt(k, dummy.matrix); refls.setMatrixAt(k, dummy.matrix); k++; } }
  for (const mesh of [posts, refls]){ mesh.count = k; mesh.instanceMatrix.needsUpdate = true; }

    dummy.position.set(p.x, 0, z); dummy.rotation.set(0, p.ry, p.lean); dummy.scale.set(p.s, p.s, p.s); dummy.updateMatrix(); palms.setMatrixAt(i, dummy.matrix); }

  // camera: a little behind, a little above, leaning into the lane change

  camera.position.set(cx + (Math.random() - 0.5) * 0.25 * sh, 3.0 + (Math.random() - 0.5) * 0.18 * sh, 9.2);
  camera.up.set(Math.sin(S.roll * 0.35), Math.cos(S.roll * 0.35), 0);

  backMat.uniforms.uAspect.value = camera.aspect; backMat.uniforms.uTime.value = T; backMat.uniforms.uSunPulse.value = S.sunPulse * motion;
  groundMat.uniforms.uScroll.value = scroll; groundMat.uniforms.uBeat.value = beat; groundMat.uniforms.uBarPhase.value = barPhase; groundMat.uniforms.uSunX.value = cx;

  // render: scene → bright → blur ¼ → blur ⅛ → composite
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  quad.material = brightMat; brightMat.uniforms.tex.value = rtScene.texture; renderer.setRenderTarget(rtA); renderer.render(postScene, postCam);
  quad.material = blurMat;
  blurMat.uniforms.tex.value = rtA.texture; blurMat.uniforms.uDir.value.set(1 / rtA.width, 0); renderer.setRenderTarget(rtB); renderer.render(postScene, postCam);
  blurMat.uniforms.tex.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, 1 / rtA.height); renderer.setRenderTarget(rtA); renderer.render(postScene, postCam);
  blurMat.uniforms.tex.value = rtA.texture; blurMat.uniforms.uDir.value.set(1 / rtC.width, 0); renderer.setRenderTarget(rtD); renderer.render(postScene, postCam);
  blurMat.uniforms.tex.value = rtD.texture; blurMat.uniforms.uDir.value.set(0, 1 / rtC.height); renderer.setRenderTarget(rtC); renderer.render(postScene, postCam);
  quad.material = compMat; const u = compMat.uniforms;
  u.tScene.value = rtScene.texture; u.tB1.value = rtA.texture; u.tB2.value = rtC.texture;
  u.uAber.value = 0.0025 + S.glitch * 0.03 * motion + S.pulse * 0.008; u.uGlitch.value = S.glitch * motion; u.uFlash.value = S.flash * 0.8;
  u.uPulse.value = S.pulse; u.uPulseCol.value.copy(S.pulseCol); u.uTime.value = T; u.uRes.value.set(renderer.domElement.width, renderer.domElement.height);

}
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });

// quiet hatch for tests and curious readers (see .claude/skills/verify)
window.nr = {
  S, cars, oncoming, PROGS, KEY, BPM, SPEED, REL, ONC_V, LANE_X, ONC_X,
  get T(){ return T; }, get frames(){ return frames; }, get fpsEMA(){ return fpsEMA; }, get resScale(){ return resScale; },
  get ctx(){ return ctx; }, get eng(){ return eng; }, get seed(){ return seed; }, get nextStep(){ return nextStep; },
